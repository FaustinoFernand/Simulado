<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulado Interativo: Administração Pública em Angola</title>
    <style>
        :root {
            --primary: #1a365d;
            --primary-light: #2b6cb0;
            --accent: #c53030;
            --accent-gold: #d69e2e;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --correct: #2f855a;
            --correct-bg: #f0fff4;
            --correct-border: #9ae6b4;
            --incorrect: #c53030;
            --incorrect-bg: #fff5f5;
            --incorrect-border: #feb2b2;
            --border: #e2e8f0;
            --shadow: 0 4px 12px rgba(0,0,0,0.06);
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 15px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 14px;
            box-shadow: var(--shadow);
            border-top: 6px solid var(--primary);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }

        .header-title-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            font-weight: 700;
        }

        .badge-total {
            background: #ebf8ff;
            color: var(--primary-light);
            font-size: 0.85rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid #bee3f8;
        }

        .filter-section {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: #fff;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 200px;
        }

        .progress-container {
            margin-top: 15px;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .progress-bar-bg {
            width: 100%;
            background-color: var(--border);
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-card {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .module-tag {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 10px;
            border-radius: 4px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1a202c;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 14px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.4;
        }

        .option-letter {
            font-weight: 700;
            color: var(--primary-light);
            background: #ebf8ff;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary-light);
            background-color: #f7fafc;
        }

        .option-btn:disabled {
            cursor: default;
        }

        .option-btn.selected-correct {
            background-color: var(--correct-bg);
            border-color: var(--correct);
            color: var(--correct);
            font-weight: 600;
        }

        .option-btn.selected-correct .option-letter {
            background-color: var(--correct);
            color: white;
        }

        .option-btn.selected-incorrect {
            background-color: var(--incorrect-bg);
            border-color: var(--incorrect);
            color: var(--incorrect);
        }

        .option-btn.selected-incorrect .option-letter {
            background-color: var(--incorrect);
            color: white;
        }

        .feedback-box {
            padding: 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.92rem;
            line-height: 1.5;
            margin-top: 10px;
        }

        .feedback-box.correct {
            background-color: var(--correct-bg);
            border: 1px solid var(--correct-border);
            color: #1c4532;
        }

        .feedback-box.incorrect {
            background-color: var(--incorrect-bg);
            border: 1px solid var(--incorrect-border);
            color: #742a2a;
        }

        .feedback-title {
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-light);
        }

        .btn-secondary {
            background-color: #edf2f7;
            color: #4a5568;
        }

        .btn-secondary:hover {
            background-color: #e2e8f0;
        }

        .results-container {
            display: none;
            text-align: center;
            flex-direction: column;
            gap: 20px;
            padding: 20px 0;
        }

        .score-circle {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: #ebf8ff;
            border: 6px solid var(--primary-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .score-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .score-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
        }

        .results-summary {
            background: #f7fafc;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid var(--border);
        }

        .results-summary h3 {
            color: var(--primary);
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            padding: 6px 0;
            border-bottom: 1px dashed var(--border);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 20px 15px;
            }
            .question-text {
                font-size: 1.05rem;
            }
            .action-bar {
                flex-direction: column;
            }
            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-title-container">
            <h1>Simulado de Administração Pública - Angola</h1>
            <span class="badge-total" id="questions-count-badge">60 Questões</span>
        </div>
        
        <div class="filter-section">
            <label for="module-select">Filtrar por Módulo:</label>
            <select id="module-select" onchange="filterQuestions()">
                <option value="all">Todos os Módulos (60 Questões)</option>
                <option value="I">Módulo I: Organização do Estado e CRA</option>
                <option value="II">Módulo II: Administração Local (Lei 15/16)</option>
                <option value="III">Módulo III: Função Pública (Lei 26/22 & Dec. 24/91)</option>
                <option value="IV">Módulo IV: Procedimento Administrativo (Lei 31/22 CPA)</option>
                <option value="V">Módulo V: Ética, Deontologia e Integridade</option>
                <option value="VI">Módulo VI: Gestão Pública, Políticas e Eficiência</option>
            </select>
        </div>

        <div class="progress-container">
            <div class="progress-info">
                <span id="progress-text">Questão 1 de 60</span>
                <span id="progress-percent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
        </div>
    </header>

    <!-- ÁREA DA PERGUNTA -->
    <div id="quiz-area" class="question-card">
        <div class="module-tag" id="module-tag">MÓDULO I</div>
        <div class="question-text" id="question-text">Carregando pergunta...</div>

        <div class="options-list" id="options-container">
            <!-- Opções inseridas dinamicamente -->
        </div>

        <div class="feedback-box" id="feedback-box">
            <div class="feedback-title" id="feedback-title"></div>
            <div id="feedback-text"></div>
        </div>

        <div class="action-bar">
            <button class="btn btn-secondary" id="prev-btn" onclick="prevQuestion()" disabled>Anterior</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>Próxima Questão</button>
        </div>
    </div>

    <!-- ÁREA DE RESULTADOS -->
    <div id="results-area" class="results-container">
        <h2>Simulado Concluído!</h2>
        <div class="score-circle">
            <span class="score-number" id="final-score-percent">0%</span>
            <span class="score-label">Aproveitamento</span>
        </div>

        <div class="results-summary">
            <h3>Resumo do Desempenho</h3>
            <div class="summary-item">
                <span>Total de Questões Respondidas:</span>
                <strong id="res-total">60</strong>
            </div>
            <div class="summary-item">
                <span>Respostas Corretas:</span>
                <strong id="res-correct" style="color: var(--correct)">0</strong>
            </div>
            <div class="summary-item">
                <span>Respostas Incorretas:</span>
                <strong id="res-incorrect" style="color: var(--incorrect)">0</strong>
            </div>
        </div>

        <button class="btn" onclick="restartQuiz()">Reiniciar Simulado</button>
    </div>
</div>

<script>
const rawQuestions = [
    // MÓDULO I
    {
        num: 1,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "O que é a Organização do Estado segundo a Constituição da República de Angola (CRA)?",
        options: [
            "É a estrutura de gestão do setor privado corporativo no território angolano.",
            "É a forma como o Estado se organiza politicamente, territorialmente e administrativamente.",
            "É o conjunto de empresas públicas com autonomia financeira e administrativa.",
            "É a divisão exclusiva dos poderes entre os órgãos judiciais das províncias."
        ],
        correct: 1,
        explanation: "Segundo a CRA, a Organização do Estado corresponde à forma como o Estado angolano se estrutura sob o ponto de vista político, territorial e administrativo para o exercício do poder."
    },
    {
        num: 2,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "Quais são os princípios fundamentais que regem a Administração Pública angolana?",
        options: [
            "Lucratividade, sigilo absoluto, discricionariedade plena e rigidez hierárquica.",
            "Centralização decisória, imunidade dos agentes, conveniência e autoridade.",
            "Legalidade, imparcialidade, transparência, responsabilidade, eficiência e serviço ao interesse público.",
            "Autonomia privada, supremacia individual, informalidade e delegação total."
        ],
        correct: 2,
        explanation: "A Administração Pública orienta-se pelos princípios da legalidade, imparcialidade, transparência, responsabilidade, eficiência e prossecução do interesse público."
    },
    {
        num: 3,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "Como se define o princípio da legalidade na Administração Pública?",
        options: [
            "A Administração Pública pode agir livremente, desde que a lei não proíba expressamente.",
            "Todos os atos da Administração devem estar de acordo estrito com a lei e a Constituição.",
            "Os regulamentos internos sobrepõem-se à Constituição da República em casos de emergência.",
            "Os atos administrativos só exigem fundamentação legal quando causarem prejuízo direto aos governantes."
        ],
        correct: 1,
        explanation: "O princípio da legalidade determina que os órgãos e agentes da Administração Pública só podem agir em conformidade com a lei e com a Constituição."
    },
    {
        num: 4,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "O que exige o princípio da imparcialidade da conduta do funcionário público?",
        options: [
            "O funcionário deve priorizar o atendimento de cidadãos do seu círculo familiar.",
            "O funcionário público deve agir sem favoritismo nem discriminação no exercício das suas funções.",
            "O funcionário deve abster-se de tomar qualquer decisão administrativa sem ordem judicial.",
            "O funcionário pode aplicar penalidades com base nas suas preferências político-partidárias."
        ],
        correct: 1,
        explanation: "A imparcialidade impõe que a Administração trate com igualdade e isenção todos os cidadãos, sem favoritismos nem discriminações."
    },
    {
        num: 5,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "Como se garante o acesso aos serviços públicos segundo os preceitos constitucionais?",
        options: [
            "Pela restrição do atendimento aos cidadãos com contribuições fiscais em dia.",
            "Mediante cobrança obrigatória de taxas em todos os atendimentos sem exceção.",
            "Pela igualdade de tratamento e pelo direito de todos os cidadãos serem atendidos.",
            "Através da priorização de cidadãos que ocupem cargos estatais de relevo."
        ],
        correct: 2,
        explanation: "O acesso aos serviços públicos é assegurado pelo princípio da igualdade de acesso e universalidade na prestação dos serviços ao cidadão."
    },
    {
        num: 6,
        module: "I",
        moduleTitle: "Módulo I: Organização do Estado e CRA",
        question: "Qual é o papel fundamental do Estado na promoção do bem-estar social?",
        options: [
            "Transferir a responsabilidade total da saúde e educação para entidades privadas.",
            "Promover políticas públicas de desenvolvimento, justiça social e qualidade de vida.",
            "Focar exclusivamente na arrecadação tributária e segurança militar.",
            "Limitar a sua intervenção à regulação do comércio internacional."
        ],
        correct: 1,
        explanation: "O Estado tem o dever constitucional de criar e executar políticas públicas que visem o desenvolvimento económico, a justiça social e a melhoria da qualidade de vida."
    },

    // MÓDULO II
    {
        num: 7,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "O que é a Administração Local do Estado segundo a Lei n.º 15/16?",
        options: [
            "É o conjunto de empresas e fundações com capitais maioritariamente privados.",
            "É o conjunto de órgãos que representam o Estado nas províncias, municípios e comunas.",
            "É o órgão máximo legislativo com jurisdição sobre as autarquias locais.",
            "É a representação diplomática do Estado Angolano no estrangeiro."
        ],
        correct: 1,
        explanation: "A Lei n.º 15/16 estabelece que a Administração Local do Estado integra os órgãos desconcentrados que asseguram o cumprimento das atribuições do Estado nas circunscrições territoriais (províncias, municípios e comunas)."
    },
    {
        num: 8,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "Quais são os principais órgãos da Administração Local do Estado em Angola?",
        options: [
            "Assembleia Nacional, Tribunais Provinciais e Ministérios.",
            "Governos Provinciais, Administrações Municipais e Administrações Comunais.",
            "Conselho de Ministros, Procuradoria e Polícia Nacional.",
            "Empresas Públicas Provinciais, Institutos e Ordens Profissionais."
        ],
        correct: 1,
        explanation: "A estrutura desconcentrada da Administração Local do Estado é composta pelos Governos Provinciais, Administrações Municipais e Administrações Comunais."
    },
    {
        num: 9,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "Qual é a função central do Governo Provincial no âmbito da Administração Local?",
        options: [
            "Aprovar a legislação nacional sobre o regime geral da função pública.",
            "Coordenar e executar políticas públicas a nível da respetiva província.",
            "Nomear os juízes dos Tribunais de Comarca da respetiva jurisdição.",
            "Gerir a política monetária e a taxa de câmbio territorial."
        ],
        correct: 1,
        explanation: "O Governo Provincial é o órgão encarregado de conduzir, coordenar e executar a política do Executivo e as tarefas da Administração Pública na Província."
    },
    {
        num: 10,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "Quais são as atribuições precípuas de uma Administração Municipal?",
        options: [
            "Executar políticas públicas locais, promover o desenvolvimento e prestar serviços à população.",
            "Elaborar leis nacionais e ratificar tratados internacionais.",
            "Superintender as forças armadas e a segurança das fronteiras.",
            "Fiscalizar a atividade das embaixadas e consulados."
        ],
        correct: 0,
        explanation: "A Administração Municipal é o órgão local encarregado de implementar as ações do Estado no município, dinamizando o desenvolvimento e prestando serviços essenciais."
    },
    {
        num: 11,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "Qual é a principal vantagem da descentralização e desconcentração administrativa?",
        options: [
            "Aumentar a burocracia e a sobreposição de competências no poder central.",
            "Permitir que as decisões e os serviços públicos estejam mais próximos da população.",
            "Transferir a responsabilidade da prestação de serviços para os cidadãos.",
            "Centralizar todas as receitas orçamentais na capital do País."
        ],
        correct: 1,
        explanation: "A aproximação dos órgãos de decisão e prestação de serviços dos cidadãos garante maior eficácia e adequação às necessidades locais reais."
    },
    {
        num: 12,
        module: "II",
        moduleTitle: "Módulo II: Administração Local do Estado (Lei n.º 15/16)",
        question: "Quais competências recaem sobre as administrações locais no desenvolvimento comunitário?",
        options: [
            "Fixar a política cambial e emitir papel-moeda nacional.",
            "Promover o desenvolvimento económico/social, gerir infraestruturas básicas, apoiar educação, saúde, cultura e assegurar a participação cidadã.",
            "Julgar crimes contra a segurança do Estado.",
            "Definir a pauta aduaneira e negociar dívida externa."
        ],
        correct: 1,
        explanation: "As administrações locais têm a seu cargo a gestão de proximidade: infraestruturas locais, saúde primária, ensino primário, ação social e fomento económico comunitário."
    },

    // MÓDULO III
    {
        num: 13,
        module: "III",
        moduleTitle: "Módulo III: Função Pública (Lei n.º 26/22 & Dec. 24/91)",
        question: "O que estabelece a Lei n.º 26/22 (Lei da Função Pública)?",
        options: [
            "O Código Penal aplicável aos crimes económicos da função pública.",
            "Os princípios, direitos, deveres e o regime jurídico geral dos funcionários públicos.",
            "As regras para a contratação exclusiva de consultores internacionais.",
            "A estrutura orgânica do Ministério das Finanças."
        ],
        correct: 1,
        explanation: "A Lei n.º 26/22 estabelece o regime jurídico geral da função pública, definindo os direitos, deveres, garantias e princípios do vínculo com o Estado."
    },
    {
        num: 14,
        module: "III",
        moduleTitle: "Módulo III: Função Pública (Lei n.º 26/22 & Dec. 24/91)",
        question: "Quem está habilitado a exercer funções públicas na Administração angolana?",
        options: [
            "Qualquer cidadão selecionado por indicação direta não regulamentada.",
            "Cidadãos que preencham os requisitos legais, mediante concurso público ou nomeação legal.",
            "Apenas cidadãos portadores de diploma de pós-graduação ou doutoramento.",
            "Apenas trabalhadores transferidos do setor privado."
        ],
        correct: 1,
        explanation: "O acesso à função pública faz-se por regra via concurso público, assegurando os requisitos legais de provimento de cargos."
    },
    {
        num: 15,
        module: "III",
        moduleTitle: "Módulo III: Função Pública (Lei n.º 26/22 & Dec. 24/91)",
        question: "Quais são direitos fundamentais assegurados aos funcionários públicos?",
        options: [
            "Isenção de impostos, estabilidade incondicional e aposentação aos 40 anos.",
            "Remuneração justa, formação contínua, progressão na carreira e proteção social.",
            "Direito de recusar cumprir ordens legais e ausência de avaliação de desempenho.",
            "Acumulação irrestrita de cargos executivos no setor privado."
        ],
        correct: 1,
        explanation: "Entre os direitos do funcionário público destacam-se a remuneração, a formação, o desenvolvimento na carreira e o sistema de proteção social."
    },
    {
        num: 16,
        module: "III",
        moduleTitle: "Módulo III: Função Pública (Lei n.º 26/22 & Dec. 24/91)",
        question: "Quais são os deveres nucleares do agente/funcionário público?",

// VARIÁVEIS DE ESTADO
let currentFilteredQuestions = [...rawQuestions];
let currentIndex = 0;
let userAnswers = {}; // { questionNum: selectedOptionIndex }

// ELEMENTOS DOM
const moduleSelect = document.getElementById('module-select');
const questionsCountBadge = document.getElementById('questions-count-badge');
const progressText = document.getElementById('progress-text');
const progressPercent = document.getElementById('progress-percent');
const progressBar = document.getElementById('progress-bar');

const quizArea = document.getElementById('quiz-area');
const resultsArea = document.getElementById('results-area');

const moduleTag = document.getElementById('module-tag');
const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const feedbackBox = document.getElementById('feedback-box');
const feedbackTitle = document.getElementById('feedback-title');
const feedbackText = document.getElementById('feedback-text');

const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

// INICIALIZAÇÃO
function initQuiz() {
    filterQuestions();
}

function filterQuestions() {
    const selectedMod = moduleSelect.value;
    if (selectedMod === 'all') {
        currentFilteredQuestions = [...rawQuestions];
    } else {
        currentFilteredQuestions = rawQuestions.filter(q => q.module === selectedMod);
    }

    questionsCountBadge.textContent = `${currentFilteredQuestions.length} Questões`;
    currentIndex = 0;
    userAnswers = {};

    quizArea.style.display = 'flex';
    resultsArea.style.display = 'none';

    loadQuestion();
}

function loadQuestion() {
    if (currentFilteredQuestions.length === 0) return;

    const q = currentFilteredQuestions[currentIndex];

    // Atualizar Barra de Progresso
    const total = currentFilteredQuestions.length;
    const currentNum = currentIndex + 1;
    const pct = Math.round((currentNum / total) * 100);

    progressText.textContent = `Questão ${currentNum} de ${total}`;
    progressPercent.textContent = `${pct}%`;
    progressBar.style.width = `${pct}%`;

    // Atualizar Informações da Pergunta
    moduleTag.textContent = q.moduleTitle;
    questionText.textContent = `${q.num}. ${q.question}`;

    // Renderizar Opções
    optionsContainer.innerHTML = '';
    feedbackBox.style.display = 'none';
    feedbackBox.className = 'feedback-box';

    const letters = ['A', 'B', 'C', 'D'];
    const hasAnswered = userAnswers.hasOwnProperty(q.num);
    const selectedOption = userAnswers[q.num];

    q.options.forEach((optText, idx) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        
        let extraClass = '';
        if (hasAnswered) {
            btn.disabled = true;
            if (idx === q.correct) {
                extraClass = 'selected-correct';
            } else if (idx === selectedOption && idx !== q.correct) {
                extraClass = 'selected-incorrect';
            }
        }

        if (extraClass) {
            btn.classList.add(extraClass);
        }

        btn.innerHTML = `
            <span class="option-letter">${letters[idx]}</span>
            <span>${optText}</span>
        `;

        btn.onclick = () => selectOption(idx);
        optionsContainer.appendChild(btn);
    });

    // Se já foi respondida, exibe o feedback
    if (hasAnswered) {
        showFeedback(selectedOption === q.correct, q.explanation);
    }

    // Atualizar Botões de Navegação
    prevBtn.disabled = currentIndex === 0;
    
    if (currentIndex === total - 1) {
        nextBtn.textContent = hasAnswered ? 'Ver Resultado Final' : 'Finalizar Simulado';
        nextBtn.disabled = !hasAnswered;
    } else {
        nextBtn.textContent = 'Próxima Questão';
        nextBtn.disabled = !hasAnswered;
    }
}

function selectOption(optionIndex) {
    const q = currentFilteredQuestions[currentIndex];
    userAnswers[q.num] = optionIndex;

    loadQuestion();
}

function showFeedback(isCorrect, explanation) {
    feedbackBox.style.display = 'block';
    if (isCorrect) {
        feedbackBox.className = 'feedback-box correct';
        feedbackTitle.innerHTML = '✔ Resposta Correta!';
    } else {
        feedbackBox.className = 'feedback-box incorrect';
        feedbackTitle.innerHTML = '✖ Resposta Incorreta!';
    }
    feedbackText.textContent = explanation;
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        loadQuestion();
    }
}

function nextQuestion() {
    const total = currentFilteredQuestions.length;
    if (currentIndex < total - 1) {
        currentIndex++;
        loadQuestion();
    } else {
        showResults();
    }
}

function showResults() {
    quizArea.style.display = 'none';
    resultsArea.style.display = 'flex';

    const total = currentFilteredQuestions.length;
    let correctCount = 0;

    currentFilteredQuestions.forEach(q => {
        if (userAnswers[q.num] === q.correct) {
            correctCount++;
        }
    });

    const incorrectCount = total - correctCount;
    const scorePct = Math.round((correctCount / total) * 100);

    document.getElementById('final-score-percent').textContent = `${scorePct}%`;
    document.getElementById('res-total').textContent = total;
    document.getElementById('res-correct').textContent = correctCount;
    document.getElementById('res-incorrect').textContent = incorrectCount;
}

function restartQuiz() {
    filterQuestions();
}

// Inicializar na carga
window.onload = initQuiz;
</script>
